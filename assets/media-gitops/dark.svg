<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="252" viewBox="0 0 1000 252" role="img">
<title>Every branch of ten services is built into images, with no deploy from CI. A release tag is promoted to the production registry and pinned in Git. Argo CD, as an app of apps, syncs platform components, stateful services and the ten services into GKE Autopilot.</title>
<text class="title" x="20" y="44">Every branch</text><text class="sub" x="20" y="61">build only, no deploy</text>
