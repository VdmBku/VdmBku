<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img">
<title>Request a demo, then: approve, pipeline, server + dns, hardening, proxy + tls, 6 services, ready</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .btn { fill: #0f8a82; transform-box: fill-box; transform-origin: center;
          animation: press 10.0s ease-in-out infinite; }
  .btn-text { font-size: 14px; font-weight: 600; fill: #ffffff; pointer-events: none; }
  .ripple { fill: none; stroke: #0f8a82; stroke-width: 2; opacity: 0; transform-box: fill-box;
             transform-origin: center; animation: ripple 10.0s ease-out infinite; }
  .track { stroke: #d0d7de; stroke-width: 3; fill: none; stroke-linecap: round; }
  .fill { stroke: #0f8a82; stroke-width: 3; fill: none; stroke-linecap: round;
           animation: fill 10.0s linear infinite; }
  .node { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 2; }
  .done { fill: #0f8a82; opacity: 0; }
  .tick { fill: none; stroke: #ffffff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .title { font-size: 13px; font-weight: 600; fill: #1f2328; }
  .sub { font-size: 12px; fill: #59636e; }
  .glow { fill: none; stroke: #0f8a82; stroke-width: 2; opacity: 0; transform-box: fill-box;
           transform-origin: center; animation: glow 10.0s ease-out infinite; }
  @keyframes press { 0% { transform: scale(1) } 2.50% { transform: scale(.93) }
                      5.00% { transform: scale(1) } 100% { transform: scale(1) } }
  @keyframes ripple { 0% { opacity: 0; transform: scale(1) } 2.50% { opacity: .8; transform: scale(1) }
                       11.00% { opacity: 0; transform: scale(1.25, 1.6) } 100% { opacity: 0 } }
  @keyframes glow { 0%, 77.00% { opacity: 0; transform: scale(1) }
                     78.00% { opacity: .9; transform: scale(1) }
                     89.00% { opacity: 0; transform: scale(2.2) } 100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) {
    .btn, .ripple, .fill, .done, .tick, .glow { animation: none !important; }
    .fill { stroke-dashoffset: 0 !important; } .done, .tick { opacity: 1 !important; } }
  .s0 { animation: s0 10.0s linear infinite; }
  @keyframes s0 { 0%, 16.50% { opacity: 0 } 18.50%, 93.00% { opacity: 1 } 97.00%, 100% { opacity: 0 } }
  .s1 { animation: s1 10.0s linear infinite; }
  @keyframes s1 { 0%, 26.50% { opacity: 0 } 28.50%, 93.00% { opacity: 1 } 97.00%, 100% { opacity: 0 } }
  .s2 { animation: s2 10.0s linear infinite; }
  @keyframes s2 { 0%, 36.50% { opacity: 0 } 38.50%, 93.00% { opacity: 1 } 97.00%, 100% { opacity: 0 } }
  .s3 { animation: s3 10.0s linear infinite; }
  @keyframes s3 { 0%, 46.50% { opacity: 0 } 48.50%, 93.00% { opacity: 1 } 97.00%, 100% { opacity: 0 } }
  .s4 { animation: s4 10.0s linear infinite; }
  @keyframes s4 { 0%, 56.50% { opacity: 0 } 58.50%, 93.00% { opacity: 1 } 97.00%, 100% { opacity: 0 } }
  .s5 { animation: s5 10.0s linear infinite; }
  @keyframes s5 { 0%, 66.50% { opacity: 0 } 68.50%, 93.00% { opacity: 1 } 97.00%, 100% { opacity: 0 } }
  .s6 { animation: s6 10.0s linear infinite; }
  @keyframes s6 { 0%, 76.50% { opacity: 0 } 78.50%, 93.00% { opacity: 1 } 97.00%, 100% { opacity: 0 } }
</style>
<style>@keyframes fill { 0%, 7.00% { stroke-dashoffset: 790 } 13.50% { stroke-dashoffset: 790.0 } 17.00% { stroke-dashoffset: 677.1 } 23.50% { stroke-dashoffset: 677.1 } 27.00% { stroke-dashoffset: 564.3 } 33.50% { stroke-dashoffset: 564.3 } 37.00% { stroke-dashoffset: 451.4 } 43.50% { stroke-dashoffset: 451.4 } 47.00% { stroke-dashoffset: 338.6 } 53.50% { stroke-dashoffset: 338.6 } 57.00% { stroke-dashoffset: 225.7 } 63.50% { stroke-dashoffset: 225.7 } 67.00% { stroke-dashoffset: 112.9 } 73.50% { stroke-dashoffset: 112.9 } 77.00% { stroke-dashoffset: 0.0 } 93.00% { stroke-dashoffset: 0 } 97.00%, 100% { stroke-dashoffset: 790 } }</style>
<rect class="ripple" x="12" y="30.0" width="150" height="40" rx="20.0"/><rect class="btn" x="12" y="30.0" width="150" height="40" rx="20.0"/><text class="btn-text" x="87.0" y="55.0" text-anchor="middle">Request a demo</text>
