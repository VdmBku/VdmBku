<text class="title" x="346" y="86" text-anchor="middle">Pipeline</text>
<text class="sub" x="346" y="105" text-anchor="middle">one job</text>
<circle class="node" cx="470" cy="50" r="10"/><circle class="done s2" cx="470" cy="50" r="10"/><path class="tick s2" d="M 465.5 50.5 l 3 3 l 6 -6.5"/>
<text class="title" x="470" y="86" text-anchor="middle">Server + DNS</text>
