<text class="title" x="594" y="86" text-anchor="middle">Hardening</text>
<text class="sub" x="594" y="105" text-anchor="middle">security baseline</text>
<circle class="node" cx="718" cy="50" r="10"/><circle class="done s4" cx="718" cy="50" r="10"/><path class="tick s4" d="M 713.5 50.5 l 3 3 l 6 -6.5"/>
<text class="title" x="718" y="86" text-anchor="middle">Proxy + TLS</text>
<text class="sub" x="718" y="105" text-anchor="middle">auto certificates</text>
