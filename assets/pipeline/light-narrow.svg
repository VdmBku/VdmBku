<svg xmlns="http://www.w3.org/2000/svg" width="400" height="522" viewBox="0 0 400 522" role="img">
<title>Delivery pipeline: commit, build &amp; test, package, provision, deploy, observe</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .num { font-size: 12px; font-weight: 600; fill: #0f8a82; letter-spacing: .08em; }
  .name { font-size: 15px; font-weight: 600; fill: #1f2328; }
  .tool { font-size: 13px; fill: #59636e; }
  .note { font-size: 12px; fill: #59636e; }
  .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
  .hl { fill: none; stroke: #0f8a82; stroke-width: 2; opacity: 0;
         animation: lit 7.199999999999999s linear infinite; }
  .wire { stroke: #d0d7de; stroke-width: 1.5; fill: none; }
  .head { fill: #d0d7de; }
  .loop { stroke: #0f8a82; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5;
           opacity: .7; animation: flow 1.6s linear infinite; }
  @keyframes lit { 0% { opacity: 0 } 3% { opacity: 1 } 16.7% { opacity: 1 }
                   19.7% { opacity: 0 } 100% { opacity: 0 } }
  @keyframes flow { to { stroke-dashoffset: -20 } }
  @media (prefers-reduced-motion: reduce) { .hl, .loop { animation: none; } }
</style>
<rect class="box" x="12" y="12" width="330" height="64" rx="10"/><rect class="hl" x="12" y="12" width="330" height="64" rx="10" style="animation-delay: 0.0s"/>
<text class="num" x="28" y="38">01</text>
<text class="name" x="58" y="38">Commit</text>
<text class="tool" x="58" y="59">Git, GitLab, GitHub</text>
<rect class="box" x="12" y="98" width="330" height="64" rx="10"/><rect class="hl" x="12" y="98" width="330" height="64" rx="10" style="animation-delay: 1.2s"/>
<text class="num" x="28" y="124">02</text>
<text class="name" x="58" y="124">Build &amp; test</text>
<text class="tool" x="58" y="145">Jenkins, GitLab CI, GitHub Actions</text>
