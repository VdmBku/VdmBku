<svg xmlns="http://www.w3.org/2000/svg" width="400" height="770" viewBox="0 0 400 770" role="img">
<title>Delivery pipeline. Commit. Build and test with build, lint, unit tests and a secret scan in parallel. Package: the artifact goes to a registry. Provision: plan and apply create or change the servers. Deploy: a rolling update onto those servers. Observe runs 24/7 and alerts the on-call SRE or DevOps engineer; fixes come back as commits.</title>
