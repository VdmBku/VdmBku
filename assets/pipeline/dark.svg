<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img">
<title>Delivery pipeline: commit, build &amp; test, package, provision, deploy, observe</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .num { font-size: 12px; font-weight: 600; fill: #2fbfb4; letter-spacing: .08em; }
  .name { font-size: 15px; font-weight: 600; fill: #e6edf3; }
  .tool { font-size: 13px; fill: #9198a1; }
  .note { font-size: 12px; fill: #9198a1; }
  .box { fill: #151b23; stroke: #3d444d; stroke-width: 1; }
  .hl { fill: none; stroke: #2fbfb4; stroke-width: 2; opacity: 0;
         animation: lit 7.199999999999999s linear infinite; }
  .wire { stroke: #3d444d; stroke-width: 1.5; fill: none; }
  .head { fill: #3d444d; }
  .loop { stroke: #2fbfb4; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5;
           opacity: .7; animation: flow 1.6s linear infinite; }
  @keyframes lit { 0% { opacity: 0 } 3% { opacity: 1 } 16.7% { opacity: 1 }
                   19.7% { opacity: 0 } 100% { opacity: 0 } }
  @keyframes flow { to { stroke-dashoffset: -20 } }
  @media (prefers-reduced-motion: reduce) { .hl, .loop { animation: none; } }
</style>
