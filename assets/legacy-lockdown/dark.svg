<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="304" viewBox="0 0 1000 304" role="img">
<title>Visitors reach the origin through the CDN, while bots and scanners hit it directly. Six steps close the direct path: report-only logging, a secret header from the CDN, the client IP set by the edge, DNS moved to the CDN, 403 for anything without the secret, and a cloud firewall that lets in only the CDN and uptime checks. Uptime stays at 100% the whole time.</title>
<rect class="box" x="20" y="26" width="190" height="54" rx="10"/><text class="box-title" x="34" y="50">Visitors</text><text class="box-sub" x="34" y="68">through the CDN</text>
<rect class="box" x="20" y="120" width="190" height="54" rx="10"/><text class="box-title" x="34" y="144">Direct hits</text><text class="box-sub" x="34" y="162">bots, scanners, old DNS</text>
<rect class="box" x="400" y="26" width="170" height="54" rx="10"/><text class="box-title" x="414" y="50">CDN</text><text class="box-sub" x="414" y="68">edge, shielding</text>
<rect class="box" x="770" y="70" width="190" height="60" rx="10"/><text class="box-title" x="784" y="94">Origin</text><text class="box-sub" x="784" y="112">web servers</text>
<rect class="uptime" x="822" y="156" width="138" height="30" rx="15"/><circle class="dot" cx="840" cy="171" r="5"/><text class="uptime-text" x="854" y="175">Uptime 100%</text>
<path class="good" d="M 210 53 L 400 53"/>
<path class="good" d="M 570 53 C 660 53, 680 92, 770 92"/>
<path class="bad" d="M 210 147 C 470 147, 560 112, 770 112"/>
<text class="bad-text refused" x="700" y="146" text-anchor="middle">403</text>
<g class="cross"><line x1="470" y1="129" x2="490" y2="149"/><line x1="490" y1="129" x2="470" y2="149"/></g>
<text class="tag a1" x="655" y="30" text-anchor="middle">secret header</text>
<text class="tag a2" x="655" y="44" text-anchor="middle">real client IP</text>
<text class="tag a3" x="305" y="44" text-anchor="middle">DNS points here</text>
<text class="tag a4" x="865" y="60" text-anchor="middle">logging who would be refused</text>
<circle class="node" cx="70" cy="240" r="10"/><circle class="done a5" cx="70" cy="240" r="10"/><path class="tick a5" d="M 65.5 240.5 l 3 3 l 6 -6.5"/>
<text class="title" x="70" y="272" text-anchor="middle">1. Report only</text><text class="sub" x="70" y="289" text-anchor="middle">log, refuse nothing</text>
<line class="wire" x1="82" y1="240" x2="230" y2="240"/><line class="wire-on a6" x1="82" y1="240" x2="230" y2="240"/>
<circle class="node" cx="242" cy="240" r="10"/><circle class="done a7" cx="242" cy="240" r="10"/><path class="tick a7" d="M 237.5 240.5 l 3 3 l 6 -6.5"/>
<text class="title" x="242" y="272" text-anchor="middle">2. Secret header</text><text class="sub" x="242" y="289" text-anchor="middle">CDN to origin</text>
<line class="wire" x1="254" y1="240" x2="402" y2="240"/><line class="wire-on a8" x1="254" y1="240" x2="402" y2="240"/>
<circle class="node" cx="414" cy="240" r="10"/><circle class="done a9" cx="414" cy="240" r="10"/><path class="tick a9" d="M 409.5 240.5 l 3 3 l 6 -6.5"/>
<text class="title" x="414" y="272" text-anchor="middle">3. Client IP</text><text class="sub" x="414" y="289" text-anchor="middle">set by the edge</text>
<line class="wire" x1="426" y1="240" x2="574" y2="240"/><line class="wire-on a10" x1="426" y1="240" x2="574" y2="240"/>
<circle class="node" cx="586" cy="240" r="10"/><circle class="done a11" cx="586" cy="240" r="10"/><path class="tick a11" d="M 581.5 240.5 l 3 3 l 6 -6.5"/>
<text class="title" x="586" y="272" text-anchor="middle">4. DNS</text><text class="sub" x="586" y="289" text-anchor="middle">apex, wildcard to CDN</text>
<line class="wire" x1="598" y1="240" x2="746" y2="240"/><line class="wire-on a12" x1="598" y1="240" x2="746" y2="240"/>
<circle class="node" cx="758" cy="240" r="10"/><circle class="done a13" cx="758" cy="240" r="10"/><path class="tick a13" d="M 753.5 240.5 l 3 3 l 6 -6.5"/>
<text class="title" x="758" y="272" text-anchor="middle">5. Refuse the rest</text><text class="sub" x="758" y="289" text-anchor="middle">403 without the secret</text>
<line class="wire" x1="770" y1="240" x2="918" y2="240"/><line class="wire-on a14" x1="770" y1="240" x2="918" y2="240"/>
<circle class="node" cx="930" cy="240" r="10"/><circle class="done a15" cx="930" cy="240" r="10"/><path class="tick a15" d="M 925.5 240.5 l 3 3 l 6 -6.5"/>
<text class="title" x="930" y="272" text-anchor="middle">6. Firewall</text><text class="sub" x="930" y="289" text-anchor="middle">CDN and uptime checks</text>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .track-title { font-size: 14px; font-weight: 600; fill: #e6edf3; }
  .track-sub { font-size: 12px; fill: #9198a1; }
  .title { font-size: 13px; font-weight: 600; fill: #e6edf3; }
  .sub { font-size: 12px; fill: #9198a1; }
  .wire { stroke: #3d444d; stroke-width: 3; stroke-linecap: round; }
  .wire-on { stroke: #2fbfb4; stroke-width: 3; stroke-linecap: round; opacity: 0; }
  .node { fill: #151b23; stroke: #3d444d; stroke-width: 2; }
  .done { fill: #2fbfb4; opacity: 0; }
  .tick { fill: none; stroke: #ffffff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .slot { fill: #3d444d; opacity: .55; }
  .bar { fill: #2fbfb4; }
  .svc { fill: #151b23; stroke: #3d444d; stroke-width: 1.5; }
  .svc-on { fill: #2fbfb4; opacity: 0; }
  .divider { stroke: #3d444d; stroke-width: 1; stroke-dasharray: 3 5; opacity: .7; }
  .a1 { animation: a1 13.4s linear infinite; } @keyframes a1 { 0%, 22.76% { opacity: 0.0 } 23.88%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a2 { animation: a2 13.4s linear infinite; } @keyframes a2 { 0%, 33.96% { opacity: 0.0 } 35.07%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a3 { animation: a3 13.4s linear infinite; } @keyframes a3 { 0%, 45.15% { opacity: 0.0 } 46.27%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a4 { animation: a4 13.4s linear infinite; } @keyframes a4 { 0%, 11.57% { opacity: 0.0 } 12.69%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a5 { animation: a5 13.4s linear infinite; } @keyframes a5 { 0%, 11.57% { opacity: 0.0 } 12.69%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a6 { animation: a6 13.4s linear infinite; } @keyframes a6 { 0%, 11.94% { opacity: 0.0 } 13.06%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a7 { animation: a7 13.4s linear infinite; } @keyframes a7 { 0%, 22.76% { opacity: 0.0 } 23.88%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a8 { animation: a8 13.4s linear infinite; } @keyframes a8 { 0%, 23.13% { opacity: 0.0 } 24.25%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a9 { animation: a9 13.4s linear infinite; } @keyframes a9 { 0%, 33.96% { opacity: 0.0 } 35.07%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a10 { animation: a10 13.4s linear infinite; } @keyframes a10 { 0%, 34.33% { opacity: 0.0 } 35.45%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a11 { animation: a11 13.4s linear infinite; } @keyframes a11 { 0%, 45.15% { opacity: 0.0 } 46.27%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a12 { animation: a12 13.4s linear infinite; } @keyframes a12 { 0%, 45.52% { opacity: 0.0 } 46.64%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a13 { animation: a13 13.4s linear infinite; } @keyframes a13 { 0%, 56.34% { opacity: 0.0 } 57.46%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a14 { animation: a14 13.4s linear infinite; } @keyframes a14 { 0%, 56.72% { opacity: 0.0 } 57.84%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a15 { animation: a15 13.4s linear infinite; } @keyframes a15 { 0%, 67.54% { opacity: 0.0 } 68.66%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } }
  @media (prefers-reduced-motion: reduce) {
    [class^="a"], [class*=" a"] { animation: none !important; opacity: 1 !important; transform: none !important; } }
</style>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .box { fill: #151b23; stroke: #3d444d; stroke-width: 1.5; }
  .box-title { font-size: 14px; font-weight: 600; fill: #e6edf3; }
  .box-sub { font-size: 12px; fill: #9198a1; }
  .good { fill: none; stroke: #2fbfb4; stroke-width: 2.5; stroke-dasharray: 7 6; animation: flow 1.1s linear infinite; }
  .bad { fill: none; stroke: #f85149; stroke-width: 2.5; stroke-dasharray: 7 6;
          animation: flow 1.1s linear infinite, cut 13.4s linear infinite; }
  .bad-text { font-size: 12px; font-weight: 600; fill: #f85149; }
  .tag { font-size: 11px; fill: #2fbfb4; font-weight: 600; }
  .refused { animation: refused 13.4s linear infinite; }
  .cross { stroke: #f85149; stroke-width: 3; stroke-linecap: round; animation: cross 13.4s linear infinite; }
  .uptime { fill: #151b23; stroke: #2fbfb4; stroke-width: 1.5; }
  .uptime-text { font-size: 12px; font-weight: 600; fill: #e6edf3; }
  .dot { fill: #2fbfb4; animation: beat 1.4s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -26 } }
  @keyframes beat { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
  @keyframes cut { 0%, 67.54% { opacity: 1 } 70.15%, 94.03% { opacity: .12 }
                   97.01%, 100% { opacity: 1 } }
  @keyframes refused { 0%, 56.34% { opacity: 0 } 57.46%, 67.91% { opacity: 1 }
                       70.15%, 100% { opacity: 0 } }
  @keyframes cross { 0%, 67.54% { opacity: 0 } 68.66%, 94.03% { opacity: 1 }
                     97.01%, 100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) {
    .good, .bad, .dot { animation: none !important; } .bad { opacity: .12 !important; }
    .refused { animation: none !important; opacity: 0 !important; } .cross { animation: none !important; opacity: 1 !important; } }
</style>
</svg>
