<svg xmlns="http://www.w3.org/2000/svg" width="400" height="610" viewBox="0 0 400 610" role="img">
<title>Visitors reach the origin through the CDN, while bots and scanners hit it directly. Six steps close the direct path: report-only logging, a secret header from the CDN, the client IP set by the edge, DNS moved to the CDN, 403 for anything without the secret, and a cloud firewall that lets in only the CDN and uptime checks. Uptime stays at 100% the whole time.</title>
<rect class="box" x="12" y="12" width="176" height="54" rx="10"/><text class="box-title" x="26" y="36">Visitors</text><text class="box-sub" x="26" y="54">through the CDN</text>
<rect class="box" x="212" y="12" width="176" height="54" rx="10"/><text class="box-title" x="226" y="36">Direct hits</text><text class="box-sub" x="226" y="54">bots, scanners</text>
<rect class="box" x="12" y="118" width="176" height="54" rx="10"/><text class="box-title" x="26" y="142">CDN</text><text class="box-sub" x="26" y="160">edge, shielding</text>
<rect class="box" x="112" y="226" width="176" height="58" rx="10"/><text class="box-title" x="126" y="250">Origin</text><text class="box-sub" x="126" y="268">web servers</text>
<path class="good" d="M 100 66 L 100 118"/>
<path class="good" d="M 100 172 C 100 200, 170 200, 170 226"/>
<path class="bad" d="M 300 66 C 300 150, 240 180, 240 226"/>
<text class="bad-text refused" x="300" y="200" text-anchor="middle">403</text>
<g class="cross"><line x1="282" y1="126" x2="302" y2="146"/><line x1="302" y1="126" x2="282" y2="146"/></g>
<text class="tag a1" x="196" y="205" text-anchor="end">secret header</text>
<rect class="uptime" x="12" y="296" width="138" height="30" rx="15"/><circle class="dot" cx="30" cy="311" r="5"/><text class="uptime-text" x="44" y="315">Uptime 100%</text>
<circle class="node" cx="28" cy="360" r="9"/><circle class="done a2" cx="28" cy="360" r="9"/><path class="tick a2" d="M 23.5 360.5 l 3 3 l 6 -6.5"/>
<text class="title" x="48" y="358">1. Report only</text><text class="sub" x="48" y="374">log, refuse nothing</text>
<line class="wire" x1="28" y1="372" x2="28" y2="392"/><line class="wire-on a3" x1="28" y1="372" x2="28" y2="392"/>
<circle class="node" cx="28" cy="404" r="9"/><circle class="done a4" cx="28" cy="404" r="9"/><path class="tick a4" d="M 23.5 404.5 l 3 3 l 6 -6.5"/>
<text class="title" x="48" y="402">2. Secret header</text><text class="sub" x="48" y="418">CDN to origin</text>
<line class="wire" x1="28" y1="416" x2="28" y2="436"/><line class="wire-on a5" x1="28" y1="416" x2="28" y2="436"/>
<circle class="node" cx="28" cy="448" r="9"/><circle class="done a6" cx="28" cy="448" r="9"/><path class="tick a6" d="M 23.5 448.5 l 3 3 l 6 -6.5"/>
<text class="title" x="48" y="446">3. Client IP</text><text class="sub" x="48" y="462">set by the edge</text>
<line class="wire" x1="28" y1="460" x2="28" y2="480"/><line class="wire-on a7" x1="28" y1="460" x2="28" y2="480"/>
<circle class="node" cx="28" cy="492" r="9"/><circle class="done a8" cx="28" cy="492" r="9"/><path class="tick a8" d="M 23.5 492.5 l 3 3 l 6 -6.5"/>
<text class="title" x="48" y="490">4. DNS</text><text class="sub" x="48" y="506">apex, wildcard to CDN</text>
<line class="wire" x1="28" y1="504" x2="28" y2="524"/><line class="wire-on a9" x1="28" y1="504" x2="28" y2="524"/>
<circle class="node" cx="28" cy="536" r="9"/><circle class="done a10" cx="28" cy="536" r="9"/><path class="tick a10" d="M 23.5 536.5 l 3 3 l 6 -6.5"/>
<text class="title" x="48" y="534">5. Refuse the rest</text><text class="sub" x="48" y="550">403 without the secret</text>
<line class="wire" x1="28" y1="548" x2="28" y2="568"/><line class="wire-on a11" x1="28" y1="548" x2="28" y2="568"/>
<circle class="node" cx="28" cy="580" r="9"/><circle class="done a12" cx="28" cy="580" r="9"/><path class="tick a12" d="M 23.5 580.5 l 3 3 l 6 -6.5"/>
<text class="title" x="48" y="578">6. Firewall</text><text class="sub" x="48" y="594">CDN and uptime checks</text>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .track-title { font-size: 14px; font-weight: 600; fill: #1f2328; }
  .track-sub { font-size: 12px; fill: #59636e; }
  .title { font-size: 13px; font-weight: 600; fill: #1f2328; }
  .sub { font-size: 12px; fill: #59636e; }
  .wire { stroke: #d0d7de; stroke-width: 3; stroke-linecap: round; }
  .wire-on { stroke: #0f8a82; stroke-width: 3; stroke-linecap: round; opacity: 0; }
  .node { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 2; }
  .done { fill: #0f8a82; opacity: 0; }
  .tick { fill: none; stroke: #ffffff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .slot { fill: #d0d7de; opacity: .55; }
  .bar { fill: #0f8a82; }
  .svc { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
  .svc-on { fill: #0f8a82; opacity: 0; }
  .divider { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 5; opacity: .7; }
  .a1 { animation: a1 29.48s linear infinite; } @keyframes a1 { 0%, 22.76% { opacity: 0.0 } 23.88%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a2 { animation: a2 29.48s linear infinite; } @keyframes a2 { 0%, 11.57% { opacity: 0.0 } 12.69%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a3 { animation: a3 29.48s linear infinite; } @keyframes a3 { 0%, 11.94% { opacity: 0.0 } 13.06%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a4 { animation: a4 29.48s linear infinite; } @keyframes a4 { 0%, 22.76% { opacity: 0.0 } 23.88%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a5 { animation: a5 29.48s linear infinite; } @keyframes a5 { 0%, 23.13% { opacity: 0.0 } 24.25%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a6 { animation: a6 29.48s linear infinite; } @keyframes a6 { 0%, 33.96% { opacity: 0.0 } 35.07%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a7 { animation: a7 29.48s linear infinite; } @keyframes a7 { 0%, 34.33% { opacity: 0.0 } 35.45%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a8 { animation: a8 29.48s linear infinite; } @keyframes a8 { 0%, 45.15% { opacity: 0.0 } 46.27%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a9 { animation: a9 29.48s linear infinite; } @keyframes a9 { 0%, 45.52% { opacity: 0.0 } 46.64%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a10 { animation: a10 29.48s linear infinite; } @keyframes a10 { 0%, 56.34% { opacity: 0.0 } 57.46%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a11 { animation: a11 29.48s linear infinite; } @keyframes a11 { 0%, 56.72% { opacity: 0.0 } 57.84%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } } .a12 { animation: a12 29.48s linear infinite; } @keyframes a12 { 0%, 67.54% { opacity: 0.0 } 68.66%, 94.03% { opacity: 1 } 97.01%, 100% { opacity: 0.0 } }
  @media (prefers-reduced-motion: reduce) {
    [class^="a"], [class*=" a"] { animation: none !important; opacity: 1 !important; transform: none !important; } }
</style>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
  .box-title { font-size: 14px; font-weight: 600; fill: #1f2328; }
  .box-sub { font-size: 12px; fill: #59636e; }
  .good { fill: none; stroke: #0f8a82; stroke-width: 2.5; stroke-dasharray: 7 6; animation: flow 2.42s linear infinite; }
  .bad { fill: none; stroke: #cf222e; stroke-width: 2.5; stroke-dasharray: 7 6;
          animation: flow 2.42s linear infinite, cut 29.48s linear infinite; }
  .bad-text { font-size: 12px; font-weight: 600; fill: #cf222e; }
  .tag { font-size: 11px; fill: #0f8a82; font-weight: 600; }
  .refused { animation: refused 29.48s linear infinite; }
  .cross { stroke: #cf222e; stroke-width: 3; stroke-linecap: round; animation: cross 29.48s linear infinite; }
  .uptime { fill: #f6f8fa; stroke: #0f8a82; stroke-width: 1.5; }
  .uptime-text { font-size: 12px; font-weight: 600; fill: #1f2328; }
  .dot { fill: #0f8a82; animation: beat 3.08s ease-in-out infinite; }
  @keyframes flow { to { stroke-dashoffset: -26 } }
  @keyframes beat { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
  @keyframes cut { 0%, 67.54% { opacity: 1 } 70.15%, 94.03% { opacity: .12 }
                   97.01%, 100% { opacity: 1 } }
  @keyframes refused { 0%, 56.34% { opacity: 0 } 57.46%, 67.91% { opacity: 1 }
                       70.15%, 100% { opacity: 0 } }
  @keyframes cross { 0%, 67.54% { opacity: 0 } 68.66%, 94.03% { opacity: 1 }
                     97.01%, 100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) {
    .good, .bad, .dot { animation: none !important; } .bad { opacity: .12 !important; }
    .refused { animation: none !important; opacity: 0 !important; } .cross { animation: none !important; opacity: 1 !important; } }
</style>
</svg>
