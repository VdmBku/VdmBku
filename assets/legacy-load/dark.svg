<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img">
<title>Server load during the bot incident: around 85 before the cache for the image resize endpoint, 2 to 7 after it. A repeat request went from 0.57 s to 0.0005 s.</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .grid { stroke: #3d444d; stroke-width: 1; opacity: .6; }
  .axis { font-size: 12px; fill: #9198a1; }
  .before { fill: none; stroke: #f85149; stroke-width: 2.5; stroke-linejoin: round;
             animation: db 24.20s linear infinite; }
  .after { fill: none; stroke: #2fbfb4; stroke-width: 2.5; stroke-linejoin: round;
            animation: da 24.20s linear infinite; }
  .marker { stroke: #2fbfb4; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .note { font-size: 13px; font-weight: 600; fill: #e6edf3; }
  .note-sub { font-size: 12px; fill: #9198a1; }
  .value-bad { font-size: 13px; font-weight: 600; fill: #f85149; }
  .value-good { font-size: 13px; font-weight: 600; fill: #2fbfb4; }
  .foot { font-size: 11px; fill: #9198a1; }
  .mark { animation: show 24.20s linear infinite; }
  .before-label { animation: peak 24.20s linear infinite; }
  .after-label { animation: low 24.20s linear infinite; }
  @keyframes db { 0% { stroke-dashoffset: 753 } 35.50%, 87.27% { stroke-dashoffset: 0 }
                  90.91%, 100% { stroke-dashoffset: 753 } }
  @keyframes da { 0%, 35.50% { stroke-dashoffset: 404 } 54.55%, 87.27% { stroke-dashoffset: 0 }
                  90.91%, 100% { stroke-dashoffset: 404 } }
  @keyframes show { 0%, 35.04% { opacity: 0 } 37.32%, 87.27% { opacity: 1 } 90.91%, 100% { opacity: 0 } }
  @keyframes peak { 0%, 26.62% { opacity: 0 } 28.44%, 87.27% { opacity: 1 } 90.91%, 100% { opacity: 0 } }
  @keyframes low { 0%, 53.64% { opacity: 0 } 56.36%, 87.27% { opacity: 1 } 90.91%, 100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) {
    .before, .after, .mark, .before-label, .after-label { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; } }
</style>
